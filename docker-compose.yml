# docker-compose.yml
networks:
  orchestrator-net:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: overwatch-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-dummy}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-dummy}
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - DYNAMODB_TABLE_NAME=${DYNAMODB_TABLE_NAME:-govdata-sessions}
      - REQUEST_TIMEOUT_SECONDS=${REQUEST_TIMEOUT_SECONDS:-240}

      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-qwen3.8-27b}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-http://host.docker.internal:1234/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-lm-studio}

      - GUS_API_KEY=${GUS_API_KEY:-dummy_gus_key_for_local}
      - FRED_API_KEY=${FRED_API_KEY:-dummy_fred_key_for_local}
    networks:
      - orchestrator-net
    depends_on:
      - dynamodb-local

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: overwatch-dynamodb
    ports:
      - "8001:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    volumes:
      - ./infra/dynamodb-data:/home/dynamodblocal/data
    networks:
      orchestrator-net:
        aliases:
          - dynamodb-local

  test-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: overwatch-test-runner
    profiles: ["test"]
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-dummy}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-dummy}
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - DYNAMODB_TABLE_NAME=${DYNAMODB_TABLE_NAME:-govdata-sessions-test}
      - PYTHONPATH=/app
      - REQUEST_TIMEOUT_SECONDS=${REQUEST_TIMEOUT_SECONDS:-240}

      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-qwen3.8-27b}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-http://host.docker.internal:1234/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-lm-studio}

      - GUS_API_KEY=${GUS_API_KEY:-dummy_gus_key_for_local}
      - FRED_API_KEY=${FRED_API_KEY:-dummy_fred_key_for_local}
    networks:
      - orchestrator-net
    depends_on:
      - dynamodb-local
