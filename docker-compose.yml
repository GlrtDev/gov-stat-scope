networks:
  orchestrator-net:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: overwatch-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
    networks:
      - orchestrator-net
    depends_on:
      - dynamodb-local

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: overwatch-dynamodb
    ports:
      - "8001:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    volumes:
      - ./infra/dynamodb-data:/home/dynamodblocal/data
    networks:
      orchestrator-net:
        aliases:
          - dynamodb-local

  test-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: overwatch-test-runner
    profiles: ["test"]
    volumes:
      - ./backend:/app
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - PYTHONPATH=/app
    networks:
      - orchestrator-net
    depends_on:
      - dynamodb-local